<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#393629"><title>A quiet morning · WellBuilt</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#393629;color:#fff9eb;font-family:Georgia,serif}#scene{position:fixed;inset:0;overflow:hidden}#plate,canvas{position:absolute;width:100%;height:100%;inset:0}#plate{object-fit:cover;object-position:60% 50%}canvas{pointer-events:none}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,24,16,.24),transparent 25%,transparent 72%,rgba(21,24,16,.4));pointer-events:none}.caption{position:absolute;left:max(32px,env(safe-area-inset-left));bottom:max(38px,env(safe-area-inset-bottom));text-shadow:0 2px 20px #26291c80;pointer-events:none}.eyebrow{font:10px/1.5 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;opacity:.85}h1{font-size:clamp(27px,3vw,45px);font-weight:400;letter-spacing:-.025em;margin:7px 0}nav{position:absolute;right:max(24px,env(safe-area-inset-right));top:max(24px,env(safe-area-inset-top));display:flex;gap:8px}button{border:1px solid #fff5;border-radius:30px;padding:11px 15px;background:#24291e55;backdrop-filter:blur(14px);color:inherit;font:12px system-ui,sans-serif;cursor:pointer;min-height:44px}button:hover{background:#24291e99}button:focus-visible{outline:2px solid #fff;outline-offset:4px}.hidden .caption{opacity:0}.caption{transition:opacity .5s} @media(max-width:600px){.caption{left:24px;bottom:28px}nav{right:16px;top:16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="scene" aria-label="A peaceful sunlit kitchen with a gently running faucet and drifting dust">
<img id="plate" src="morning-kitchen-friends.png" alt="Sunlit kitchen with a pink piggy bank, Rascal the hamster beside a mug, a fish bowl and a framed ETC digital host portrait">
<canvas aria-hidden="true"></canvas><div class="shade"></div>
<div class="caption"><div class="eyebrow">Take a little time</div><h1>A quiet morning.</h1></div>
<nav aria-label="Scene controls"><button id="motion" aria-pressed="false">Pause motion</button><button id="quiet" aria-pressed="false">Hide words</button><button id="full">Full screen</button></nav>
</main>
<script>
const img=document.querySelector('#plate'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let running=!reduce.matches,frame=0,last=0,time=0,w=0,h=0,scale=1,ox=0,oy=0;
let leaves=[];
// Three isolated leaf tips; pots, stems and the rest of each plant stay still.
function makeLeaves(){leaves=[[946,306,40,57,957,309,.045],[696,373,35,47,723,380,.05],[901,253,38,38,906,282,.045]].map(([x,y,w,h,px,py,angle])=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,x,y,w,h,0,0,w,h);g.globalCompositeOperation='destination-in';g.translate(w/2,h/2);g.scale(w/2,h/2);const m=g.createRadialGradient(0,0,.52,0,0,1);m.addColorStop(0,'#000');m.addColorStop(1,'transparent');g.fillStyle=m;g.fillRect(-1,-1,2,2);return{c,x,y,px,py,angle}})}
// Local image deformation keeps the surrounding cup and bowl fixed. No second
// copy of the character is overlaid, so a moving nose or tail leaves no ghost.
function movePatch(x,y,width,height,shift){
 const cols=8,rows=6;
 function point(ix,iy){const sx=x+width*ix/cols,sy=y+height*iy/rows,u=ix/cols,v=iy/rows;const edge=Math.sin(Math.PI*u)*Math.sin(Math.PI*v),d=shift(sx,sy);return {sx,sy,x:sx+d[0]*edge,y:sy+d[1]*edge}}
 function triangle(a,b,c){const den=(b.sx-a.sx)*(c.sy-a.sy)-(c.sx-a.sx)*(b.sy-a.sy);const A=((b.x-a.x)*(c.sy-a.sy)-(c.x-a.x)*(b.sy-a.sy))/den,B=((b.y-a.y)*(c.sy-a.sy)-(c.y-a.y)*(b.sy-a.sy))/den,C=((c.x-a.x)*(b.sx-a.sx)-(b.x-a.x)*(c.sx-a.sx))/den,D=((c.y-a.y)*(b.sx-a.sx)-(b.y-a.y)*(c.sx-a.sx))/den;
 ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.clip();ctx.transform(A,B,C,D,a.x-A*a.sx-C*a.sy,a.y-B*a.sx-D*a.sy);ctx.drawImage(img,0,0);ctx.restore()}
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=point(i,j),b=point(i+1,j),c=point(i+1,j+1),d=point(i,j+1);triangle(a,b,c);triangle(a,c,d)}
}
function animateFriends(){
 // The fish hovers in its bowl with a tail flick; glass and waterline stay still.
 movePatch(1470,468,99,65,(x,y)=>{const tail=Math.max(0,(x-1523)/46);return [Math.sin(time*1.3)*1.5,Math.sin(time*5.5)*tail*4+Math.sin(time*1.3)*.6]});
 // Two quick nose twitches toward the cup, then a long relaxed pause.
 const phase=time%11,sniff=phase<2.6?Math.pow(Math.sin(phase/2.6*Math.PI),2)*(1+.3*Math.sin(phase*13)):0;
 const headShift=(x,y)=>{const nose=Math.max(0,Math.min(1,(x-486)/63));return [sniff*9*nose,-sniff*2*nose]};
 if(sniff>.001)movePatch(479,400,82,65,headShift);

}
const particles=Array.from({length:48},(_,i)=>({x:Math.abs((Math.sin(i*127.1)*43758.5453)%1),y:(i*.61803398875)%1,r:.55+(i%4)*.18,s:5+i%7}));
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);ox=(w-img.naturalWidth*scale)*.6;oy=(h-img.naturalHeight*scale)*.5;}
function draw(now){frame=0;if(!running||document.hidden)return;time+=last?Math.min((now-last)/1000,.1):0;last=now;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);const W=img.naturalWidth,H=img.naturalHeight;
for(const [i,leaf] of leaves.entries()){ctx.save();ctx.translate(leaf.px,leaf.py);ctx.rotate(Math.sin(time*.72+i*1.8)*leaf.angle);ctx.drawImage(leaf.c,leaf.x-leaf.px,leaf.y-leaf.py);ctx.restore()}
animateFriends();
// Flowing highlights follow the faucet's thin stream and stay inside the sink.
for(let i=0;i<18;i++){const p=(time*.85+i/18)%1,y=H*(.362+p*.319),x=W*(.601-.004*p)+Math.sin(time*9+p*32)*.6;ctx.beginPath();ctx.strokeStyle='rgba(255,253,232,'+(.45+.5*Math.sin(p*Math.PI))+')';ctx.lineWidth=2.1;ctx.moveTo(x,y);ctx.lineTo(x+.3,y+8+i%6);ctx.stroke()}
// Dust drifts a few pixels each second, with fade-in/out at the beam edges.
for(const p of particles){const u=(p.x+time*p.s/1000)%1,v=(p.y-time*p.s/1600+100)%1,x=W*(.32+u*.45),y=H*(.2+v*.46);const fade=Math.sin(u*Math.PI)*Math.sin(v*Math.PI);ctx.beginPath();ctx.fillStyle='rgba(255,245,208,'+(fade*.65)+')';ctx.shadowColor='#fff1c0';ctx.shadowBlur=1;ctx.arc(x+Math.sin(time*.4+p.y*15)*8,y,p.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
ctx.restore();frame=requestAnimationFrame(draw);}
function sync(){cancelAnimationFrame(frame);last=0;document.querySelector('#motion').textContent=running?'Pause motion':'Play motion';document.querySelector('#motion').setAttribute('aria-pressed',String(!running));if(running&&!document.hidden)frame=requestAnimationFrame(draw);else if(!running)ctx.clearRect(0,0,w,h);}
img.onload=()=>{makeLeaves();resize();sync()};if(img.complete&&img.naturalWidth){makeLeaves();resize();sync()}addEventListener('resize',resize);document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',()=>{running=!reduce.matches;sync()});document.querySelector('#motion').onclick=()=>{running=!running;sync()};document.querySelector('#quiet').onclick=e=>{document.body.classList.toggle('hidden');const hidden=document.body.classList.contains('hidden');e.target.textContent=hidden?'Show words':'Hide words';e.target.setAttribute('aria-pressed',String(hidden))};document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('#full').textContent='Full screen unavailable'}};
</script>
</body></html>
